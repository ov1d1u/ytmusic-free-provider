name: live-extraction

# Early warning that anonymous YouTube extraction still works.
#
# Since PR #44 the provider pins no player_client and inherits yt-dlp's
# defaults, so what users actually get can change without a commit in this
# repo. Nothing in the offline suite can see that: every other test feeds
# synthetic format tables to the selector and stays green regardless of what
# YouTube is really serving. Issue #41 went unnoticed for months for that
# reason.
#
# Deliberately NOT run on pull requests. GitHub runner IPs are frequently
# rate-limited or bot-blocked by YouTube, and that noise would gate unrelated
# diffs and train everyone to ignore a failing check.
#
# The scheduled run does fail loudly, though. A canary that always concludes
# green sends no notification, and its step summary is only seen by someone who
# already went looking, which defeats the point of having one. Because it never
# runs on a pull request, a red run here blocks nothing. The check is retried
# once before the job gives up, which absorbs a transient rate limit.
#
# The retry does not rule out an address block: it runs on the same runner after
# 60s, so a bot check keyed to the IP is refused identically both times. That is
# why the podcast episode check skips on a bot check rather than failing. It was
# red for five nights running on that alone (2026-08-13 to 2026-08-17) while the
# music checks passed beside it, and a canary nobody believes is worse than no
# canary. The music checks still fail on a bot check, deliberately, because
# tracks are refused far less readily than long-form video and losing those is
# worth waking someone for.

on:
  schedule:
    # 05:17 UTC daily. Off the hour on purpose: scheduled jobs at :00 queue
    # behind everyone else's cron and get delayed.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r tests/python/requirements.txt

      - name: Record the yt-dlp version under test
        run: |
          python -m yt_dlp --version | sed 's/^/yt-dlp /' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve a real stream anonymously
        id: live
        # continue-on-error lets the summary step below run and describe what
        # happened. The final step then fails the job, so the run goes red and
        # GitHub actually notifies someone.
        continue-on-error: true
        run: |
          set -o pipefail
          # -rs is load-bearing: the summary step greps live.log for lines
          # starting with SKIPPED, and only the -rs short summary puts them at
          # column 0. Plain -v renders skips mid-line, which that grep misses.
          for attempt in 1 2; do
            echo "::group::attempt $attempt"
            if python -m pytest tests/python -m "live and not musicbrainz" -v -rs 2>&1 | tee live.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 1 ]; then
              echo "Attempt 1 failed. Retrying in 60s, in case this runner's IP"
              echo "is transiently rate-limited or bot-blocked by YouTube."
              sleep 60
            fi
          done
          exit 1

      - name: Summarise the outcome
        run: |
          {
            if [ "${{ steps.live.outcome }}" = "success" ]; then
              echo "## Anonymous extraction and playback are working"
              echo
              echo "yt-dlp resolved an audio-only stream above the bitrate floor,"
              echo "and the resolved url served real bytes when fetched immediately."
              # Surfaced on the green path on purpose. A check that skipped
              # verified nothing, and without this the summary claims a coverage
              # the run did not have.
              if grep -q '^SKIPPED' live.log 2>/dev/null; then
                echo
                echo "Some checks skipped, so they verified nothing this run:"
                echo
                echo '```'
                grep '^SKIPPED' live.log
                echo '```'
                echo
                echo "A skipped podcast episode check means this runner's address"
                echo "was refused by YouTube's bot check. The music checks above"
                echo "did pass, so anonymous playback itself is healthy."
              fi
            else
              echo "## Anonymous extraction or playback FAILED"
              echo
              echo "This usually means one of:"
              echo
              echo "- yt-dlp's default clients now require a PO token for anonymous playback"
              echo "- the YouTube extractor is broken in the installed yt-dlp release"
              echo "- this runner's IP is rate-limited or bot-blocked by YouTube"
              echo "- a url resolved but 403'd on fetch. That is the issue #51 shape:"
              echo "  a pre-roll ad window the provider failed to wait out. Check the"
              echo "  failing test name — if it is the fetch or the available_at check,"
              echo "  the problem is playback rather than extraction."
              echo
              echo "This already retried once, which rules out a transient rate limit."
              echo "It does NOT rule out an address block: the retry runs on the same"
              echo "runner, so a bot check keyed to the IP is refused both times. A"
              echo "blocked runner address says nothing about the provider, so re-run"
              echo "the job before changing any code. If it keeps failing, check"
              echo "yt-dlp's issue tracker next, and only then treat it as a provider"
              echo "problem."
              echo
              echo "A bot check on the music checks is what you are looking at if the"
              echo "failing test names mention extraction. The podcast episode check"
              echo "skips on a bot check instead of failing, so it is not the cause of"
              echo "a red run here."
              echo
              echo '<details><summary>pytest output</summary>'
              echo
              echo '```'
              tail -n 60 live.log || echo "no output captured"
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if extraction or playback is broken
        # The whole point of the canary. Without this the job concludes green,
        # GitHub sends nothing, and the summary above is read by nobody.
        if: steps.live.outcome == 'failure'
        run: |
          echo "::error title=Anonymous extraction or playback failed::yt-dlp could not resolve a usable audio stream for any known video, or the resolved url did not serve bytes, after a retry. See the job summary for what to check."
          exit 1

  musicbrainz:
    name: MusicBrainz API canary (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Check the live MusicBrainz JSON contract
        run: python -m pytest tests/python -m musicbrainz -v
