[pytest]
testpaths = tests/python
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# `live` tests reach out to the real YouTube, so they are deselected by
# default: an ordinary run has to stay offline and deterministic. The scheduled
# live-extraction workflow re-selects them with `-m live`, which wins because
# command-line arguments are applied after addopts.
addopts = -ra --strict-markers -m "not live"
markers =
    live: hits the real YouTube API over the network; deselected unless `-m live` is passed
    musicbrainz: advisory MusicBrainz API canary; always combined with the live marker
